    <rect x="1295" y="803" width="300" height="74" rx="12" fill="#f3faf7"/>
    <text x="1315" y="832" class="label green">users + oauth_accounts</text>
    <text x="1315" y="858" class="small">Application identity linked to GitHub</text>
    <rect x="1295" y="892" width="300" height="74" rx="12" fill="#f3faf7"/>
    <text x="1315" y="921" class="label green">user_sessions</text>
    <text x="1315" y="947" class="small">Session records; no provider token storage</text>
    <rect x="1295" y="981" width="300" height="104" rx="12" fill="#f3faf7"/>
    <text x="1315" y="1010" class="label green">diagrams</text>
    <text x="1315" y="1037" class="small">owner_id · JSONB content · version</text>
    <text x="1315" y="1062" class="small">Cascade delete with owning user</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1700" y="719" width="236" height="177" rx="20" fill="#fff" stroke="#f0ddbd"/>
    <rect x="1700" y="719" width="236" height="54" rx="20" fill="#fff3df"/>
    <path d="M1700 753v20h236v-20" fill="#fff3df"/>
