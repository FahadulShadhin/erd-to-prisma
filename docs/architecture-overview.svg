<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1360" viewBox="0 0 2000 1360">
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10243e"/>
      <stop offset="1" stop-color="#173d68"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17304d" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2878d0"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#159477"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8056c7"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#728198"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #192b42; }
      .title { fill: #fff; font-size: 37px; font-weight: 750; letter-spacing: .2px; }
      .subtitle { fill: #d3e2f5; font-size: 17px; }
      .section { fill: #16395f; font-size: 21px; font-weight: 750; letter-spacing: 1.4px; }
      .card-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; fill: #53647a; }
      .small { font-size: 14px; fill: #66788d; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: .5px; }
      .number { font-size: 13px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .white { fill: #fff; }
      .blue { fill: #2878d0; }
      .green { fill: #159477; }
      .purple { fill: #8056c7; }
    </style>
  </defs>

  <rect width="2000" height="1360" fill="#f3f6fb"/>
  <rect width="2000" height="112" fill="url(#header)"/>
  <text x="64" y="52" class="title" fill="#ffffff">ERD TO PRISMA · PROJECT ARCHITECTURE</text>
  <text x="66" y="83" class="subtitle" fill="#d3e2f5">Browser-based ER modeling · authenticated cloud persistence · Prisma generation</text>
  <rect x="1688" y="34" width="246" height="42" rx="21" fill="#ffffff" fill-opacity=".12"/>
  <text x="1811" y="60" class="label white" text-anchor="middle">SYSTEM OVERVIEW</text>

  <!-- Deployment -->
  <text x="64" y="158" class="section">01  BUILD &amp; DEPLOYMENT</text>
  <line x1="64" y1="174" x2="1936" y2="174" stroke="#d7e0eb" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="64" y="204" width="360" height="190" rx="18" fill="#fff" stroke="#d9e3ef"/>
    <rect x="64" y="204" width="9" height="190" rx="4" fill="#52657d"/>
    <circle cx="106" cy="247" r="20" fill="#eaf0f7"/>
    <path d="M97 247h18m-9-9v18" stroke="#52657d" stroke-width="3" stroke-linecap="round"/>
    <text x="139" y="254" class="card-title">Source repository</text>
    <text x="94" y="294" class="body">React + TypeScript frontend</text>
    <text x="94" y="320" class="body">Express + TypeScript API</text>
    <text x="94" y="358" class="small">pnpm workspace · Node.js 22+</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="526" y="204" width="390" height="190" rx="18" fill="#fff" stroke="#cfe2fa"/>
    <rect x="526" y="204" width="9" height="190" rx="4" fill="#2878d0"/>
    <circle cx="568" cy="247" r="20" fill="#e8f2ff"/>
    <path d="M558 250h20m-16-8 8-7 8 7m-16 13 8 7 8-7" fill="none" stroke="#2878d0" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="601" y="254" class="card-title">Frontend build</text>
    <text x="556" y="294" class="body">pnpm build → static dist/</text>
    <text x="556" y="320" class="body">Vite bundles browser app</text>
    <text x="556" y="358" class="small">Public setting: VITE_API_BASE_URL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1018" y="204" width="390" height="190" rx="18" fill="#fff" stroke="#cfe2fa"/>
    <rect x="1018" y="204" width="9" height="190" rx="4" fill="#2878d0"/>
    <circle cx="1060" cy="247" r="20" fill="#e8f2ff"/>
    <path d="M1050 240h20v14h-20zm5 19h10m-5-5v5" fill="none" stroke="#2878d0" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="1093" y="254" class="card-title">Netlify · static frontend</text>
    <text x="1048" y="294" class="body">Serves the SPA over HTTPS</text>
    <text x="1048" y="320" class="body">Browser calls separately hosted API</text>
    <text x="1048" y="358" class="small">App origin is used for OAuth + cookies</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="526" y="421" width="390" height="190" rx="18" fill="#fff" stroke="#d8cff1"/>
    <rect x="526" y="421" width="9" height="190" rx="4" fill="#8056c7"/>
    <circle cx="568" cy="464" r="20" fill="#f1ecfb"/>
    <path d="M558 457h20v14h-20zm4 19h12m-6-5v5" fill="none" stroke="#8056c7" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="601" y="471" class="card-title">API build &amp; service</text>
    <text x="556" y="511" class="body">pnpm build:server → server/dist/</text>
    <text x="556" y="537" class="body">Node.js service runs Express API</text>
    <text x="556" y="575" class="small">Private settings: OAuth, session, database</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1018" y="421" width="390" height="190" rx="18" fill="#fff" stroke="#cce9df"/>
    <rect x="1018" y="421" width="9" height="190" rx="4" fill="#159477"/>
    <circle cx="1060" cy="464" r="20" fill="#e5f6f0"/>
    <ellipse cx="1060" cy="458" rx="10" ry="4" fill="none" stroke="#159477" stroke-width="2.5"/>
    <path d="M1050 458v13c0 5 20 5 20 0v-13m-20 6c0 5 20 5 20 0" fill="none" stroke="#159477" stroke-width="2.5"/>
    <text x="1093" y="471" class="card-title">PostgreSQL</text>
    <text x="1048" y="511" class="body">Users · OAuth identities · sessions</text>
    <text x="1048" y="537" class="body">Owner-scoped diagrams · JSONB</text>
    <text x="1048" y="575" class="small">Run pnpm db:migrate before API release</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1512" y="204" width="424" height="190" rx="18" fill="#fff" stroke="#f0ddbd"/>
    <rect x="1512" y="204" width="9" height="190" rx="4" fill="#c08025"/>
    <circle cx="1554" cy="247" r="20" fill="#fff3df"/>
    <path d="M1554 235l4 8 9 1-7 6 2 9-8-4-8 4 2-9-7-6 9-1z" fill="none" stroke="#b8781f" stroke-width="2"/>
    <text x="1587" y="254" class="card-title">GitHub OAuth</text>
    <text x="1542" y="294" class="body">OAuth app + registered callback</text>
    <text x="1542" y="320" class="body">API handles authorization exchange</text>
    <text x="1542" y="358" class="small">Provider tokens are not stored</text>
  </g>

  <path d="M424 275H510" fill="none" stroke="#728198" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="466" y="258" class="small" text-anchor="middle">source</text>
  <path d="M916 275H1002" fill="none" stroke="#2878d0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="959" y="258" class="small" text-anchor="middle">deploy</text>
  <path d="M424 340H468V516H510" fill="none" stroke="#728198" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="466" y="432" class="small" transform="rotate(-90 466 432)" text-anchor="middle">server build</text>
  <path d="M916 516H1002" fill="none" stroke="#8056c7" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="959" y="499" class="small" text-anchor="middle">connect</text>
  <rect x="1443" y="421" width="493" height="190" rx="18" fill="#f9fafc" stroke="#d9e3ef" stroke-dasharray="7 6"/>
  <text x="1470" y="457" class="label" fill="#52657d">RELEASE CHECK</text>
  <text x="1470" y="490" class="body">1 · Build frontend and API independently.</text>
  <text x="1470" y="518" class="body">2 · Apply SQL migrations to the API database.</text>
  <text x="1470" y="546" class="body">3 · Set origins, OAuth callback, and API URL.</text>
  <text x="1470" y="578" class="small">Keep server credentials out of the frontend build.</text>

  <!-- Runtime -->
  <text x="64" y="666" class="section">02  RUNTIME, DATA &amp; AUTHENTICATION</text>
  <line x1="64" y1="682" x2="1936" y2="682" stroke="#d7e0eb" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="64" y="719" width="425" height="411" rx="20" fill="#fff" stroke="#cfe2fa"/>
    <rect x="64" y="719" width="425" height="54" rx="20" fill="#eaf3ff"/>
    <path d="M64 753v20h425v-20" fill="#eaf3ff"/>
    <text x="94" y="754" class="card-title">Browser · React application</text>
    <text x="94" y="808" class="body">App.tsx gates workspace on auth state</text>
    <text x="94" y="837" class="body">React Flow canvas · entities · relations</text>
    <text x="94" y="866" class="body">Sidebar · diagram list · account controls</text>
    <rect x="90" y="892" width="373" height="77" rx="12" fill="#f5f8fc"/>
    <text x="110" y="920" class="label" fill="#52657d">SIGNED-IN DIAGRAMS</text>
    <text x="110" y="947" class="small">API is authoritative; localStorage is per-user cache</text>
    <rect x="90" y="986" width="373" height="57" rx="12" fill="#f2edfc"/>
    <text x="110" y="1011" class="label purple">SIGNED-OUT</text>
    <text x="110" y="1033" class="small">Fresh temporary workspace; never shows cloud data</text>
    <text x="94" y="1090" class="small">Theme preference also stays browser-local.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="649" y="719" width="440" height="411" rx="20" fill="#fff" stroke="#d8cff1"/>
    <rect x="649" y="719" width="440" height="54" rx="20" fill="#f1ecfb"/>
    <path d="M649 753v20h440v-20" fill="#f1ecfb"/>
    <text x="679" y="754" class="card-title">Express API · Node.js 22+</text>
    <text x="679" y="808" class="body">/auth/* · GitHub OAuth + session</text>
    <text x="679" y="837" class="body">/api/auth/me · resolve signed-in user</text>
    <text x="679" y="866" class="body">/api/diagrams · authenticated CRUD</text>
    <rect x="675" y="892" width="388" height="77" rx="12" fill="#f8f6fc"/>
    <text x="695" y="920" class="label purple">SESSION SECURITY</text>
    <text x="695" y="947" class="small">HTTP-only cookie · server-side session in PostgreSQL</text>
    <rect x="675" y="986" width="388" height="57" rx="12" fill="#f8f6fc"/>
    <text x="695" y="1011" class="label purple">DATA SAFETY</text>
    <text x="695" y="1033" class="small">Owner-scoped queries · optimistic version checks</text>
    <text x="679" y="1090" class="small">CORS and origin checks use configured app origin.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1268" y="719" width="354" height="411" rx="20" fill="#fff" stroke="#cce9df"/>
    <rect x="1268" y="719" width="354" height="54" rx="20" fill="#e5f6f0"/>
    <path d="M1268 753v20h354v-20" fill="#e5f6f0"/>
