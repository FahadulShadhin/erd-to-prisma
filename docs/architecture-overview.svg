    <text x="1730" y="809" class="body">OAuth provider</text>
    <text x="1730" y="839" class="small">Browser redirects;</text>
    <text x="1730" y="862" class="small">API handles callback.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1700" y="931" width="236" height="199" rx="20" fill="#fff" stroke="#cfe2fa"/>
    <rect x="1700" y="931" width="236" height="54" rx="20" fill="#eaf3ff"/>
    <path d="M1700 965v20h236v-20" fill="#eaf3ff"/>
    <text x="1730" y="966" class="card-title">Generated output</text>
    <text x="1730" y="1020" class="body">Prisma schema</text>
    <text x="1730" y="1049" class="body">Express project ZIP</text>
    <text x="1730" y="1081" class="small">Created client-side</text>
    <text x="1730" y="1104" class="small">from current diagram.</text>
  </g>

  <!-- Request and persistence arrows -->
  <path d="M489 805H630" fill="none" stroke="#2878d0" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="492" y="771" width="144" height="27" rx="13" fill="#f3f6fb"/>
  <text x="564" y="790" class="label blue" text-anchor="middle">HTTPS · COOKIE</text>
  <text x="560" y="827" class="small" text-anchor="middle">/auth · /api</text>

  <path d="M1089 827H1248" fill="none" stroke="#159477" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="1096" y="792" width="147" height="27" rx="13" fill="#f3f6fb"/>
  <text x="1169" y="811" class="label green" text-anchor="middle">SQL · OWNER ID</text>

  <!-- OAuth steps -->
  <rect x="64" y="1164" width="1872" height="137" rx="18" fill="#fff" stroke="#d9e3ef"/>
  <text x="92" y="1200" class="section" style="font-size:16px">GITHUB SIGN-IN SEQUENCE</text>
  <g>
    <circle cx="112" cy="1245" r="15" fill="#8056c7"/><text x="112" y="1245" class="number">1</text>
    <text x="139" y="1250" class="body">Browser opens</text><text x="139" y="1273" class="small">API login route</text>
    <path d="M302 1245h54" stroke="#8056c7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <circle cx="383" cy="1245" r="15" fill="#8056c7"/><text x="383" y="1245" class="number">2</text>
    <text x="410" y="1250" class="body">API redirects</text><text x="410" y="1273" class="small">to GitHub consent</text>
    <path d="M580 1245h54" stroke="#8056c7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <circle cx="661" cy="1245" r="15" fill="#8056c7"/><text x="661" y="1245" class="number">3</text>
    <text x="688" y="1250" class="body">GitHub returns</text><text x="688" y="1273" class="small">to API callback</text>
    <path d="M846 1245h54" stroke="#8056c7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <circle cx="927" cy="1245" r="15" fill="#8056c7"/><text x="927" y="1245" class="number">4</text>
    <text x="954" y="1250" class="body">API upserts identity</text><text x="954" y="1273" class="small">and saves user session</text>
    <path d="M1141 1245h54" stroke="#8056c7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <circle cx="1222" cy="1245" r="15" fill="#8056c7"/><text x="1222" y="1245" class="number">5</text>
    <text x="1249" y="1250" class="body">API redirects</text><text x="1249" y="1273" class="small">back to frontend</text>
    <path d="M1406 1245h54" stroke="#2878d0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <circle cx="1487" cy="1245" r="15" fill="#2878d0"/><text x="1487" y="1245" class="number">6</text>
    <text x="1514" y="1250" class="body">App resolves session</text><text x="1514" y="1273" class="small">then loads owned diagrams</text>
  </g>
  <text x="1935" y="1336" class="small" text-anchor="end">Source: docs/ARCHITECTURE.md · Deployment settings are configured per environment.</text>
</svg>
